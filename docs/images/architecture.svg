<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1460" width="1600" height="1460" font-family="Inter, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#334155"/>
    </marker>
    <style>
      .title{font-size:38px;font-weight:800;fill:#0f172a}
      .subtitle{font-size:20px;fill:#475569}
      .tag{font-size:17px;font-weight:800;fill:#fff;letter-spacing:1px}
      .layer{font-size:27px;font-weight:800}
      .speed{font-size:18px;font-weight:600;fill:#475569}
      .h{font-size:21px;font-weight:700;fill:#0f172a}
      .t{font-size:18px;fill:#334155}
      .flow{font-size:18px;font-weight:700;fill:#0f172a}
      .note{font-size:15px;fill:#64748b}
      .card{fill:#fff;stroke:#cbd5e1;stroke-width:1.5}
      .sim{font-size:18px;font-weight:700;fill:#b45309}
      .gap{fill:#fff;stroke:#cbd5e1;stroke-width:1.5;stroke-dasharray:6 5}
    </style>
  </defs>

  <rect width="1600" height="1460" fill="#f8fafc"/>

  <text x="40" y="62" class="title">Agentic Warehouse Automation</text>
  <text x="40" y="96" class="subtitle">System 2 / 1 / 0: layers organized by how fast they must react</text>

  <!-- UI -->
  <rect x="40" y="122" width="1100" height="70" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="64" y="166" class="h">Operations dashboard</text>
  <text x="300" y="166" class="t">Chat with tool trace · live KPIs · orders · Isaac stream · floor map</text>
  <path d="M590,192 L590,226" stroke="#334155" stroke-width="2" marker-start="url(#arrow)" marker-end="url(#arrow)"/>

  <!-- SYSTEM 2 -->
  <rect x="40" y="230" width="1100" height="250" rx="16" fill="#f5f3ff" stroke="#7c3aed" stroke-width="2.5"/>
  <rect x="40" y="230" width="190" height="40" rx="10" fill="#7c3aed"/>
  <text x="60" y="257" class="tag">SYSTEM 2</text>
  <text x="250" y="260" class="layer" fill="#5b21b6">Reasoning · what to do and where</text>
  <text x="1118" y="260" class="speed" text-anchor="end">seconds · ~0.1 Hz</text>

  <rect x="64" y="290" width="252" height="168" rx="10" class="card"/>
  <text x="86" y="326" class="h">Agent · Qwen3.8-27B</text>
  <text x="86" y="362" class="t">Open weights, vLLM</text>
  <text x="86" y="392" class="t">17 typed tools</text>
  <text x="86" y="422" class="t">Plans, dispatches, replans</text>

  <rect x="332" y="290" width="252" height="168" rx="10" class="card"/>
  <text x="354" y="326" class="h">VLM perception</text>
  <text x="354" y="362" class="t">Same model, image input</text>
  <text x="354" y="392" class="t">Checks bins &amp; totes</text>
  <text x="354" y="422" class="t">Points at the target (2D)</text>

  <rect x="600" y="290" width="252" height="168" rx="10" class="card"/>
  <text x="622" y="326" class="h">3D pose estimation</text>
  <text x="622" y="362" class="t">Plugged in after the VLM</text>
  <text x="622" y="392" class="t">2D point + depth → pose</text>
  <text x="622" y="422" class="sim">◆ Mask: sim-assisted</text>

  <rect x="868" y="290" width="248" height="168" rx="10" class="card"/>
  <text x="890" y="326" class="h">Business judgment</text>
  <text x="890" y="362" class="t">Holds orders it can't fill</text>
  <text x="890" y="392" class="t">Cross-docks shortages</text>
  <text x="890" y="422" class="t">Reports unprompted</text>

  <!-- 2 <-> executor -->
  <path d="M330,482 L330,518" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="346" y="506" class="flow">dispatch_task(plan)</text>
  <path d="M760,518 L760,482" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="776" y="506" class="flow">task result · findings</text>

  <!-- S2 -> S1 interface -->
  <rect x="40" y="520" width="1100" height="110" rx="16" fill="#f1f5f9" stroke="#64748b" stroke-width="2.5"/>
  <rect x="40" y="520" width="270" height="40" rx="10" fill="#64748b"/>
  <text x="60" y="547" class="tag">S2 → S1 INTERFACE</text>
  <text x="330" y="550" class="layer" fill="#334155">Task executor</text>
  <text x="1118" y="550" class="speed" text-anchor="end">per step</text>
  <text x="64" y="600" class="t">Deterministic state machine stored in Postgres · sequences skills · regrasp / replan / reallocate · resumes after restart · reports up</text>

  <!-- executor <-> 1 -->
  <path d="M330,632 L330,668" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="346" y="656" class="flow">skill + target pose</text>
  <path d="M760,668 L760,632" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="776" y="656" class="flow">success / failure</text>

  <!-- SYSTEM 1 -->
  <rect x="40" y="670" width="1100" height="250" rx="16" fill="#eff6ff" stroke="#2563eb" stroke-width="2.5"/>
  <rect x="40" y="670" width="190" height="40" rx="10" fill="#2563eb"/>
  <text x="60" y="697" class="tag">SYSTEM 1</text>
  <text x="250" y="700" class="layer" fill="#1e40af">Action · how the arm and base move</text>
  <text x="1118" y="700" class="speed" text-anchor="end">60 Hz</text>

  <rect x="64" y="730" width="330" height="168" rx="10" class="card"/>
  <text x="88" y="766" class="h">Grasp &amp; arm motion</text>
  <text x="88" y="802" class="t">Grasp planned from the pose</text>
  <text x="88" y="832" class="t">Lula IK targets</text>
  <text x="88" y="862" class="t">Cartesian arm trajectories</text>

  <rect x="414" y="730" width="330" height="168" rx="10" class="card"/>
  <text x="438" y="766" class="h">Base motion</text>
  <text x="438" y="802" class="t">Waypoint planner</text>
  <text x="438" y="832" class="t">Straight when no rack blocks</text>
  <text x="438" y="862" class="t">Smooth start and stop</text>

  <rect x="764" y="730" width="352" height="168" rx="10" class="gap"/>
  <text x="788" y="766" class="h">Learned policy slot</text>
  <text x="788" y="802" class="t">SmolVLA / diffusion servers</text>
  <text x="788" y="832" class="t">Paused until retrained</text>
  <text x="788" y="862" class="t">for the current stance</text>

  <!-- 1 <-> 0 -->
  <path d="M330,922 L330,968" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="346" y="952" class="flow">joint &amp; base targets</text>
  <path d="M760,968 L760,922" stroke="#334155" stroke-width="2.2" marker-end="url(#arrow)"/>
  <text x="776" y="952" class="flow">joint state · camera frames</text>

  <!-- SYSTEM 0 -->
  <rect x="40" y="970" width="1100" height="220" rx="16" fill="#f0fdf4" stroke="#16a34a" stroke-width="2.5"/>
  <rect x="40" y="970" width="190" height="40" rx="10" fill="#16a34a"/>
  <text x="60" y="997" class="tag">SYSTEM 0</text>
  <text x="250" y="1000" class="layer" fill="#166534">Execution · joint drives</text>
  <text x="1118" y="1000" class="speed" text-anchor="end">60 Hz sim step</text>

  <rect x="64" y="1030" width="505" height="138" rx="10" class="card"/>
  <text x="88" y="1066" class="h">Simulated drives</text>
  <text x="88" y="1102" class="t">PD position control of the Franka joints</text>
  <text x="88" y="1132" class="t">Pose-driven holonomic base</text>

  <rect x="589" y="1030" width="527" height="138" rx="10" class="gap"/>
  <text x="613" y="1066" class="h">Not modelled</text>
  <text x="613" y="1102" class="t">No force, torque or tactile control</text>
  <text x="613" y="1132" class="t">Grasp closes, then the item attaches to the hand</text>

  <!-- Outside the layers -->
  <rect x="40" y="1220" width="540" height="130" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="64" y="1256" class="h">Robot gateway · interface</text>
  <text x="64" y="1292" class="t">Mock robot for fast evals</text>
  <text x="64" y="1322" class="t">Isaac Sim over HTTP, one swappable protocol</text>

  <rect x="600" y="1220" width="540" height="130" rx="12" fill="#fff" stroke="#94a3b8" stroke-width="1.5"/>
  <text x="624" y="1256" class="h">Isaac Sim 5.1 · environment</text>
  <text x="624" y="1292" class="t">Ridgeback + Franka, physics, cameras</text>
  <text x="624" y="1322" class="t">Scene built from the WMS, seeded faults</text>

  <!-- System of record -->
  <rect x="1180" y="122" width="380" height="1228" rx="16" fill="#fff7ed" stroke="#ea580c" stroke-width="2.5"/>
  <rect x="1180" y="122" width="250" height="40" rx="10" fill="#ea580c"/>
  <text x="1200" y="149" class="tag">SYSTEM OF RECORD</text>
  <text x="1204" y="204" class="h">Postgres WMS</text>
  <text x="1204" y="238" class="t">Orders, stock, tasks,</text>
  <text x="1204" y="266" class="t">exceptions, audit log</text>
  <text x="1204" y="316" class="h">Transactional</text>
  <text x="1204" y="350" class="t">Row-locked reservations</text>
  <text x="1204" y="378" class="t">One transaction per pick</text>
  <text x="1204" y="428" class="h">Live everywhere</text>
  <text x="1204" y="462" class="t">DB change → NOTIFY →</text>
  <text x="1204" y="490" class="t">WebSocket → dashboard</text>
  <text x="1204" y="560" class="h">Write-back</text>
  <text x="1204" y="594" class="t">Every step updates</text>
  <text x="1204" y="622" class="t">the record</text>
  <text x="1204" y="1256" class="h">Feeds the simulator</text>
  <text x="1204" y="1290" class="t">Locations and stock</text>
  <text x="1204" y="1318" class="t">build the Isaac scene</text>
  <path d="M1180,355 L1144,355" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M1144,580 L1180,580" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <path d="M1180,1290 L1144,1290" stroke="#ea580c" stroke-width="2.2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>

  <text x="40" y="1388" class="sim">◆ Sim-assisted</text>
  <text x="190" y="1388" class="t">Matching the VLM point to an object and its pixel mask uses simulator ground truth; on hardware a promptable segmenter would replace it</text>
  <text x="40" y="1432" class="subtitle">Python · FastAPI · Postgres · React · vLLM · Isaac Sim · Docker</text>
</svg>
