services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse"]
      interval: 2s
      retries: 20

  llm:
    image: vllm/vllm-openai:v0.33.0
    command: >
      --model Qwen/Qwen3.5-9B
      --served-model-name qwen3.5-9b
      --quantization fp8
      --max-model-len 32768
      --max-num-seqs 16
      --gpu-memory-utilization 0.35
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
    environment:
      HF_HUB_OFFLINE: "1"
    ports:
      - "${LLM_PORT:-8001}:8000"
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:8000/health"]
      interval: 10s
      retries: 60

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://warehouse:warehouse@postgres:5432/warehouse
      LLM_BASE_URL: http://llm:8000/v1
      LLM_MODEL: qwen3.5-9b
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8010}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  pgdata:
