services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: warehouse
      POSTGRES_PASSWORD: warehouse
      POSTGRES_DB: warehouse
    ports:
      - "5432:5432"
    volumes:
      - ./db:/docker-entrypoint-initdb.d:ro
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U warehouse"]
      interval: 2s
      retries: 20

  llm:
    image: vllm/vllm-openai:v0.33.0
    command: >
      --model Qwen/Qwen3.8-27B-FP8
      --served-model-name qwen3.8-27b
      --max-model-len 32768
      --max-num-seqs 4
      --gpu-memory-utilization 0.75
      --enable-auto-tool-choice
      --tool-call-parser qwen3_coder
      --reasoning-parser qwen3
    environment:
      HF_HUB_OFFLINE: "1"
    ports:
      - "${LLM_PORT:-8001}:8000"
    volumes:
      - ${HF_HOME:-~/.cache/huggingface}:/root/.cache/huggingface
    ipc: host
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    healthcheck:
      test: ["CMD-SHELL", "curl -sf localhost:8000/health"]
      interval: 10s
      retries: 60

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://warehouse:warehouse@postgres:5432/warehouse
      LLM_BASE_URL: http://llm:8000/v1
      LLM_MODEL: qwen3.8-27b
      ROBOT_BACKEND: ${ROBOT_BACKEND:-mock}
      ISAAC_URL: http://host.docker.internal:8020
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./db:/srv/db:ro
    ports:
      - "${BACKEND_PORT:-8010}:8000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    image: node:24-slim
    working_dir: /app
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_URL: http://localhost:${BACKEND_PORT:-8010}
      VITE_SIM_URL: ${SIM_URL:-}
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

  isaac:
    image: nvcr.io/nvidia/isaac-sim:5.1.0
    profiles: ["isaac"]
    user: "0"
    network_mode: host
    entrypoint: /isaac-sim/python.sh
    command: warehouse_sim.py --api http://localhost:${BACKEND_PORT:-8010} ${ISAAC_ARGS:-}
    working_dir: /workspace
    environment:
      ACCEPT_EULA: "Y"
      PRIVACY_CONSENT: "Y"
      OMNI_KIT_ALLOW_ROOT: "1"
    volumes:
      - ./isaac:/workspace:ro
      - ${ISAAC_CACHE:-~/.cache/isaac-sim}/kit:/isaac-sim/kit/cache
      - ${ISAAC_CACHE:-~/.cache/isaac-sim}/ov:/root/.cache/ov
      - ${ISAAC_CACHE:-~/.cache/isaac-sim}/pip:/root/.cache/pip
      - ${ISAAC_CACHE:-~/.cache/isaac-sim}/glcache:/root/.cache/nvidia/GLCache
      - ${ISAAC_CACHE:-~/.cache/isaac-sim}/computecache:/root/.nv/ComputeCache
      - ${ISAAC_CACHE:-~/.cache/isaac-sim}/data:/root/.local/share/ov/data
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    depends_on:
      - backend

volumes:
  pgdata:
